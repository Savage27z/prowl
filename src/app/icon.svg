<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>
  <!-- Outer ring — scope/target -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#c8a87c" stroke-width="24"/>
  <!-- Inner iris -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#c8a87c" stroke-width="16"/>
